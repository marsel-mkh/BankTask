input {
  kafka {
    bootstrap_servers => "kafka:9093"
    topics => ["service_logs"]
    codec => "json"
  }
}

filter {
  date {
    match => ["timestamp", "ISO8601"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "service-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}